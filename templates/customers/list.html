{% extends "base.html" %}{% block title %}Customers · VyaparFlow{% endblock %}{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4"><h1 class="h2 page-title">Customers</h1><a class="btn btn-primary" href="{% url 'add_customer' %}">＋ Add customer</a></div>
<div class="card p-3"><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Name</th><th>Phone</th><th>Address</th></tr></thead><tbody>{% for c in customers %}<tr><td class="fw-semibold">{{ c.name }}</td><td>{{ c.phone|default:"—" }}</td><td>{{ c.address|default:"—" }}</td></tr>{% empty %}<tr><td colspan="3" class="text-center text-secondary py-5">No customers added yet.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
