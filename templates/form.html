{% extends "base.html" %}{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><div class="card p-4 p-md-5"><h1 class="h3 page-title mb-4">{{ title }}</h1><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}{% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}</div>{% endfor %}<button class="btn btn-primary">Save</button> <a class="btn btn-outline-secondary" href="{% url back_url %}">Cancel</a></form></div></div></div>{% endblock %}
