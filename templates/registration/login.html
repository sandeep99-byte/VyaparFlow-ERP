{% extends "base.html" %}{% block title %}Login · VyaparFlow{% endblock %}{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card p-4 p-md-5"><h1 class="h3 page-title mb-4">Welcome back</h1>
<form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}</div>{% endfor %}
<button class="btn btn-primary w-100">Login</button></form><p class="mt-3 mb-0">New here? <a href="{% url 'register' %}">Create an account</a></p></div></div></div>{% endblock %}
